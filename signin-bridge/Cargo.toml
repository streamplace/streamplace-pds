[package]
name = "signin-bridge"
version = "0.1.0"
edition = "2021"
publish = false
description = "An OpenID Connect provider in front of sign-in methods vlpds doesn't speak: Sign-In with Ethereum"

# standalone: not a member of the vlpds package's workspace
[workspace]

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "form", "json", "query"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
# Ethereum: secp256k1 recovery of personal_sign signatures, Keccak-256
k256 = { version = "0.14", features = ["ecdsa"] }
sha3 = "0.11"
# the id_token signing key (ES256)
p256 = { version = "0.14", features = ["ecdsa", "getrandom", "pem"] }
sha2 = "0.11"
base64 = "0.23"
hex = "0.4"
rand = "0.8"
subtle = "2"
parking_lot = "0.12"
# contract wallets: eth_call to an operator-configured JSON-RPC endpoint
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
time = { version = "0.3", features = ["parsing", "formatting"] }
url = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "form", "query"] }

[profile.release]
opt-level = 3
